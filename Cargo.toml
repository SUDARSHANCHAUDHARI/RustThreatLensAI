[package]
name = "threatlensai"
version = "1.1.1"
edition = "2021"
authors = ["Sudarshan Chaudhari <sunny.sudarshan@gmail.com>"]
description = "Log threat analyzer for brute-force attempts, suspicious IPs, secrets, and anomalies"
license = "MIT"
repository = "https://github.com/SUDARSHANCHAUDHARI/RustThreatLensAI"
readme = "README.md"
keywords = ["security", "logs", "threats", "secrets", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "threatlens"
path = "src/lib.rs"

[[bin]]
name = "threatlensai"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
